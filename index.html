<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>data.sgr 解包 / 打包</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --panel2: #23272f; --line: #2e343f;
    --text: #e8eaf0; --dim: #9aa3b2; --accent: #f2c14e; --ok: #64d29a; --err: #ff7b72;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 36px 20px 60px; }
  h1 { font-size: 20px; margin: 0 0 22px; color: var(--dim); font-weight: 600; letter-spacing: .3px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 780px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px; display: flex; flex-direction: column; gap: 12px;
  }
  .card h2 { font-size: 15px; margin: 0; font-weight: 600; }
  .drop {
    border: 1.5px dashed var(--line); border-radius: 10px; padding: 24px 14px;
    text-align: center; cursor: pointer; transition: .15s; background: var(--panel2);
    font-size: 14px;
  }
  .drop:hover, .drop.over { border-color: var(--accent); background: #2a2f39; }
  .drop.has { border-style: solid; border-color: var(--ok); }
  .fname { color: var(--ok); font-size: 13px; margin-top: 6px; word-break: break-all; }
  button {
    font: inherit; border: 0; border-radius: 9px; padding: 10px 16px;
    background: var(--accent); color: #14161a; font-weight: 600; cursor: pointer; transition: .15s;
  }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button.dl { background: var(--ok); width: 100%; }
  .barwrap { height: 6px; background: #11141a; border-radius: 4px; overflow: hidden; }
  .barwrap.busy { box-shadow: 0 0 0 1px var(--line); }
  .bar { height: 100%; width: 0%; background: var(--accent); transition: width .2s; }
  .status { font-size: 12.5px; color: var(--dim); min-height: 19px; }
  .stat { font-size: 13px; color: var(--dim); line-height: 1.6; margin-bottom: 10px; }
  .stat b { color: var(--text); font-weight: 600; }
  .err {
    color: var(--err); font-size: 13px; background: #2a1d1d; border: 1px solid #4a2a2a;
    border-radius: 8px; padding: 10px 12px; word-break: break-word;
  }
  label.chk { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--dim); cursor: pointer; }
  label.chk input { accent-color: var(--accent); }
  details { font-size: 13px; color: var(--dim); }
  details summary { cursor: pointer; }
  details .row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  details input {
    flex: 1; font: inherit; font-size: 13px; padding: 6px 9px; border-radius: 7px;
    border: 1px solid var(--line); background: #11141a; color: var(--text); min-width: 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>data.sgr 解包 / 打包</h1>
  <div class="grid">
    <section class="card">
      <h2>解包 → zip</h2>
      <div class="drop" id="un-drop">拖入或选择 .sgr<div class="fname"></div></div>
      <input type="file" id="un-file" accept=".sgr" hidden>
      <label class="chk"><input type="checkbox" id="un-meta" checked><span>附带元数据</span></label>
      <button id="un-go" disabled>开始</button>
      <div class="barwrap"><div class="bar" id="un-bar"></div></div>
      <div class="status" id="un-status"></div>
      <div id="un-result"></div>
    </section>
    <section class="card">
      <h2>打包 → sgr</h2>
      <div class="drop" id="pk-drop">拖入或选择 .zip<div class="fname"></div></div>
      <input type="file" id="pk-file" accept=".zip" hidden>
      <details id="pk-adv">
        <summary>高级</summary>
        <div id="pk-adv-body" style="display:none">
          <div class="row"><input id="pk-title" placeholder="标题"></div>
          <div class="row"><input id="pk-dev" placeholder="开发组"></div>
          <div class="row"><input id="pk-main" placeholder="入口脚本"></div>
        </div>
      </details>
      <button id="pk-go" disabled>开始</button>
      <div class="barwrap"><div class="bar" id="pk-bar"></div></div>
      <div class="status" id="pk-status"></div>
      <div id="pk-result"></div>
    </section>
  </div>
</div>
<script src="js/app.min.js"></script>
</body>
</html>
